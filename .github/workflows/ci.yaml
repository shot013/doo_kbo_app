name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  build-release:
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # google-services.json은 key.properties와 마찬가지로 저장소에
      # 커밋하지 않는다 (.gitignore). google-services Gradle 플러그인은
      # 이 파일이 없으면 빌드 자체가 실패하므로, 실제 Firebase 프로젝트와
      # 무관하게 구조만 유효한 더미 파일을 빌드 직전에 만들어 넣는다.
      # 이 잡은 "릴리스 빌드가 깨지지 않는지"만 검증하는 용도라 실제
      # Firebase 시크릿은 필요하지 않다.
      - name: Write placeholder google-services.json
        run: |
          cat > android/app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "ci-placeholder",
              "storage_bucket": "ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "com.kbo.app"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  { "current_key": "AIzaSyCIPlaceholderKeyNotARealSecret000" }
                ],
                "services": {
                  "appinvite_service": { "other_platform_oauth_client": [] }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON

      # key.properties가 없으므로 android/app/build.gradle.kts의 release
      # signingConfig가 debug 키로 폴백된다. 이 빌드는 서명 결과물이 아니라
      # "릴리스 빌드가 깨지지 않는지"만 검증하기 위한 것이다.
      - name: Build release app bundle (unsigned verification)
        run: flutter build appbundle --release

  # main에 push될 때만(=develop→main PR이 머지될 때) 실행되어, 실제 서명된
  # AAB를 빌드하고 fastlane으로 Play Console '테스트' 비공개 테스트 트랙에
  # 업로드한다. build-release와 달리 이 잡은 실제 시크릿(서명 키,
  # google-services.json, Play 서비스 계정 키)을 쓴다.
  deploy-play-store:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Restore release keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Restore real google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > android/app/google-services.json

      - name: Build signed release app bundle
        run: flutter build appbundle --release

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: android

      - name: Restore Play Store service account key
        run: echo "${{ secrets.PLAY_STORE_JSON_KEY_BASE64 }}" | base64 -d > "$RUNNER_TEMP/play-store-key.json"

      - name: Upload to Play Store closed testing track
        working-directory: android
        env:
          PLAY_STORE_JSON_KEY_PATH: ${{ runner.temp }}/play-store-key.json
        run: bundle exec fastlane deploy_closed_testing
